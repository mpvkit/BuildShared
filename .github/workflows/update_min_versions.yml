name: Update Minimum OS Versions

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and parse MoltenVK deployment targets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const url = 'https://raw.githubusercontent.com/KhronosGroup/MoltenVK/refs/heads/main/MoltenVK/MoltenVK.xcodeproj/project.pbxproj';
            const resp = await fetch(url);
            const text = await resp.text();

            const targets = {};
            const patterns = {
              ios: /IPHONEOS_DEPLOYMENT_TARGET\s*=\s*([\d.]+)/,
              macos: /MACOSX_DEPLOYMENT_TARGET\s*=\s*([\d.]+)/,
              tvos: /TVOS_DEPLOYMENT_TARGET\s*=\s*([\d.]+)/,
            };

            for (const [key, regex] of Object.entries(patterns)) {
              const match = text.match(regex);
              if (match) {
                targets[key] = match[1];
              }
            }

            core.info(`Parsed targets: ${JSON.stringify(targets)}`);

            const filePath = 'Sources/BuildShared/Models/PlatformType.swift';
            const content = fs.readFileSync(filePath, 'utf8');

            const versionMap = {
              ios: targets.ios,
              tvos: targets.tvos,
              macos: targets.macos,
            };

            let updated = content;
            let hasChanges = false;

            for (const [platform, newVersion] of Object.entries(versionMap)) {
              const pattern = new RegExp(`(case \\.${platform}(?:,|:)[\\s\\S]*?return )"(\\d+\\.\\d+)"`);
              const match = content.match(pattern);
              if (match) {
                const oldVersion = match[2];
                if (newVersion !== oldVersion) {
                  updated = updated.replace(pattern, `$1"${newVersion}"`);
                  core.info(`Updating ${platform}: ${oldVersion} -> ${newVersion}`);
                  hasChanges = true;
                }
              }
            }

            if (hasChanges) {
              require('fs').writeFileSync(filePath, updated, 'utf8');
              core.info('PlatformType.swift updated');
            } else {
              core.info('No version changes needed');
            }

            core.exportVariable('HAS_CHANGES', hasChanges ? 'true' : 'false');

      - name: Create Pull Request
        if: env.HAS_CHANGES == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            Sources/BuildShared/Models/PlatformType.swift
          title: "Raise minimum OS versions"
          body: |
            Updates minimum OS deployment targets to match MoltenVK's Xcode project settings.

            Source: https://raw.githubusercontent.com/KhronosGroup/MoltenVK/refs/heads/main/MoltenVK/MoltenVK.xcodeproj/project.pbxproj
          commit-message: "chore: raise minimum OS versions"
